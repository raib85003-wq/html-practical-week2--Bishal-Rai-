<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">

        <br><br>
        <label>Gender:</label>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

        <br><br>
        <label>Interests:</label>

        <input type="checkbox" id="programming" name="interests" value="programming">
        <label for="programming">Programming</label>

        <input type="checkbox" id="gaming" name="interests" value="gaming">
        <label for="gaming">Gaming</label>

        <input type="checkbox" id="sports" name="interests" value="sports">
        <label for="sports">Sports</label>

        <input type="checkbox" id="music" name="interests" value="music">
        <label for="music">Music</label>

        <br><br>
        <label for="department">Department:</label>

        <select id="department" name="department">
            <option value="">-- Select Department --</option>
            <option value="bit">Bachelor of Information Technology</option>
            <option value="bca">Bachelor of Computer Application</option>
            <option value="bim">Bachelor of Information Management</option>
            <option value="csit">BSc Computer Science and Information Technology</option>
        </select>
        <br><br>
        <label for="about">About You:</label>
        <br>

        <textarea id="about" name="about" rows="5" cols="40"></textarea>

        <br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
