    <main>
        <section>

            <h2>My Contact Information</h2>

            <p>
                <strong>Phone:</strong>

            </p>

            <p>
                <strong>Email:</strong>

        <section>

        <section>
            <h2>Send Me a Message</h2>

            <form>

                <label for="name">Name:</label>
                <br>

                <input type="text"
                       id="name"
                       name="name">

                <br><br>


                <label for="email">Email:</label>
                <br>

                <input type="email"
                       id="email"
                       name="email">

                <br><br>


                <label for="subject">Subject:</label>
                <br>

                <input type="text"
                       id="subject"
                       name="subject">

                <br><br>


                <label for="message">Message:</label>
                <br>

                <textarea id="message"
                          name="message"
                          rows="6"
                          cols="40"></textarea>

                <br><br>


                <input type="submit" value="Send Message">

            </form>

        </section>
        <section>

            <h2>My Location</h2>

            <iframe
                src="https://www.google.com/maps?q=Kathmandu,Nepal&output=embed"
                width="600"
                height="400"
